# Minimal Apache configuration for the telecom project.
LoadModule proxy_module        modules/mod_proxy.so
LoadModule proxy_http_module   modules/mod_proxy_http.so
LoadModule headers_module      modules/mod_headers.so
LoadModule rewrite_module      modules/mod_rewrite.so

Listen 80

ProxyPreserveHost On
ProxyPass        /api/  http://127.0.0.1:8000/
ProxyPassReverse /api/  http://127.0.0.1:8000/

Alias /data/ "/ABSOLUTE/PATH/TO/distributed_telecom_billing/powerbi/dashboard_data/"

<Directory "/ABSOLUTE/PATH/TO/distributed_telecom_billing/powerbi/dashboard_data/">
    Require all granted
    Header set Access-Control-Allow-Origin "*"
    Options Indexes
</Directory>

<Location /health>
    ProxyPass        http://127.0.0.1:8000/health
    ProxyPassReverse http://127.0.0.1:8000/health
</Location>

ErrorLog  "logs/apache_error.log"
CustomLog "logs/apache_access.log" common
